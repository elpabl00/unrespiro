<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario con EmailJS</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("A5lCmcM-0wNckg7jE"); // ← reemplaza aquí tu public key
    })();
  </script>
</head>
<body>
  <h2>Suscríbete</h2>
  <form id="formulario">
    <input type="text" name="nombre" placeholder="Tu nombre" required><br><br>
    <input type="email" name="correo" placeholder="Tu correo electrónico" required><br><br>
    <button type="submit">Enviar</button>
  </form>

  <p id="mensaje"></p>

  <script>
    document.getElementById('formulario').addEventListener('submit', function(e) {
      e.preventDefault();

      emailjs.send("service_ldrdpm2", "template_wvb58i7", {
        nombre: this.nombre.value,
        correo: this.correo.value
      }).then(() => {
        document.getElementById("mensaje").textContent = "✅ Revisa tu correo, te hemos enviado un mensaje.";
      }, (error) => {
        document.getElementById("mensaje").textContent = "❌ Error al enviar el correo.";
        console.error(error);
      });
    });
  </script>
</body>
</html>
