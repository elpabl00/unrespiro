<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Un respiro</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("A5lCmcM-0wNckg7jE");
    })();
  </script>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      display: flex;
      height: 100vh;
      background: black;
      align-items: center;
      justify-content: center;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    input, button {
      display: block;
      margin: 10px 0;
      width: 100%;
      padding: 10px;
    }
  </style>
</head>
<body>
  <form id="formulario">
  <h1>UN RESPIRO</h1>
    <h2>REGISTRATE</h2>
    <input type="text" name="nombre" placeholder="tu Nombre" required />
    <input type="email" name="correo" placeholder="Email" required />
    <button type="submit">Enviar</button>
    <p id="mensaje"></p>
  </form>

  <script>
    const form = document.getElementById("formulario");
    const mensaje = document.getElementById("mensaje");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      emailjs.send("service_ldrdpm2", "template_wvb58i7", {
        name: form.nombre.value,
        email: form.correo.value
      }).then(() => {
        mensaje.textContent = "✅ Revisa tu correo, te hemos enviado un mensaje.";
      }, (error) => {
        mensaje.textContent = "❌ Error al enviar el correo.";
        console.error("Error:", error);
      });
    });
  </script>
</body>
</html>
